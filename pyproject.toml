[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "0.1.0"
description = "Astra: A continuously evolving AI entity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioboto3>=15.0.0",
    "aiohttp>=3.11.0",
    "boto3>=1.38.23,<1.39",
    "discord.py==2.4.0",
    "fuzzywuzzy==0.18.0",
    "openai==1.96.1",
    "python-Levenshtein>=0.25.0",
    "python-dotenv==1.1.1",
    "pytz>=2022.1",
    "rapidfuzz==3.13.0",
    "Requests==2.32.4",
    "sentence_transformers==5.0.0",
    "streamlit>=1.33.0",
    "wikipedia==1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "utils*", "astra_growth*"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | maintenance/spring_cleaning
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "maintenance/spring_cleaning"]
known_first_party = ["app", "utils", "astra_growth"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv", "maintenance/spring_cleaning"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (external services)",
    "unit: marks tests as unit (no external services)",
]
